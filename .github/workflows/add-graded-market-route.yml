name: Add graded current-listing route

on:
  push:
    branches:
      - agent/graded-market-v1
    paths:
      - .github/workflows/add-graded-market-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graded-market-v1
      - name: Patch worker
        run: |
          cp worker.js /tmp/worker-before.js
          python3 scripts/patch-graded-market.py
      - name: Verify additive route only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/worker-before.js').read_text()
          after=Path('worker.js').read_text()
          for x in ['async function handleGradedMarket(request, env)','/api/ebay/graded-market','/buy/browse/v1/item_summary/search?','getAppAccessToken(env)']:
              if x not in after: raise SystemExit('Missing '+x)
          for x in ['/api/ebay/status','/api/ebay/policies','/api/ebay/orders','/api/ebay/disconnect','/oauth/start','/ebay/callback']:
              if x not in after: raise SystemExit('Existing route missing '+x)
          if len(after) <= len(before): raise SystemExit('Patch was not additive')
          PY
      - name: Commit worker patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git commit -m 'Add read-only graded current-listing market route'
          git push origin agent/graded-market-v1
